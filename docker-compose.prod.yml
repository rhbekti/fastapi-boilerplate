services:
  api:
    build:
      context: .
      target: prod
    restart: unless-stopped
    expose:
      - "8000"          # tidak di-expose ke host, hanya ke nginx via internal network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-net
